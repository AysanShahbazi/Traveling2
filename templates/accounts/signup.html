{% load static %}
<!DOCTYPE html>
<html lang="zxx" class="no-js">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="{% static 'img/fav.png' %}">
    <meta charset="UTF-8">
    <title>Sign Up | Travel Site</title>

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,400,300,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <style>
        .signup-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            padding: 80px 20px;
        }

        .signup-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .signup-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .signup-subtitle {
            color: #8a8a9e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group-custom {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .input-group-custom:focus-within {
            background: white;
            box-shadow: 0 0 0 2px rgba(230, 126, 34, 0.1);
        }

        .input-icon {
            padding: 12px 12px 12px 15px;
            color: #e67e22;
            font-size: 16px;
        }

        .form-control {
            flex: 1;
            padding: 12px 15px 12px 5px;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            border-radius: 8px;
        }

        .signup-btn {
            width: 100%;
            background: #e67e22;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #d35400;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eef2f6;
            font-size: 13px;
            color: #8a8a9e;
        }

        .login-link a {
            color: #e67e22;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .message.success {
            background: #d1fae5;
            color: #059669;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    {% include 'includes/header.html' %}

    <div class="signup-wrapper">
        <div class="signup-card">
            <h1 class="signup-title">Create Account</h1>
            <p class="signup-subtitle">Join us and start your journey</p>

            {% if messages %}
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa fa-lock"></i></span>
                        <input type="password" name="password1" class="form-control" placeholder="Create a password"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa fa-check-circle"></i></span>
                        <input type="password" name="password2" class="form-control" placeholder="Confirm your password"
                            required>
                    </div>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
            </div>
        </div>
    </div>

    {% include 'includes/footer.html' %}
</body>

</html>
