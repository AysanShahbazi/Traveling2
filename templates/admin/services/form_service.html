{% extends 'admin/base_admin.html' %}

{% block title %}{{ action }} Service{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ action }} Service</h2>
    <a href="{% url 'pages:manage_services' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Services
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Service Title *</label>
                <input type="text" class="form-control" name="title" value="{{ service.title|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description *</label>
                <textarea class="form-control" name="description" rows="3"
                    required>{{ service.description|default:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Link (optional)</label>
                <input type="url" class="form-control" name="link" value="{{ service.link|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Image</label>
                {% if service.image and service.image.url %}
                <div class="mb-2">
                    <img src="{{ service.image.url }}" alt="" style="max-height: 100px;">
                </div>
                {% endif %}
                <input type="file" class="form-control" name="image">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Display Order</label>
                    <input type="number" class="form-control" name="order" value="{{ service.order|default:'0' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <div class="form-check mt-4">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if
                            service.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ action }} Service
                </button>
                <a href="{% url 'pages:manage_services' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
