{% extends 'admin/base_admin.html' %}

{% block title %}{{ action }} Booking{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ action }} Booking</h2>
    <a href="{% url 'pages:manage_bookings' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <div class="alert alert-info">
                <strong>Reference:</strong> {{ booking.booking_ref }}
                <br>
                <strong>Created:</strong> {{ booking.created_at|date:"Y-m-d H:i" }}
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" class="form-control" name="full_name" value="{{ booking.full_name|default:'' }}"
                        required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-control" name="email" value="{{ booking.email|default:'' }}"
                        required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" value="{{ booking.phone|default:'' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total (تومان) *</label>
                    <input type="number" class="form-control" name="total" value="{{ booking.total|default:0 }}"
                        required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-control" name="status">
                        <option value="confirmed">Confirmed</option>
                        <option value="pending">Pending</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Payment Method</label>
                    <select class="form-control" name="payment_method">
                        <option value="credit_card">Credit Card</option>
                        <option value="paypal">PayPal</option>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="cash">Cash</option>
                    </select>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {{ action }} Booking
                </button>
                <a href="{% url 'pages:manage_bookings' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>

        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var statusSelect = document.querySelector('select[name="status"]');
        if (statusSelect) {
            var currentStatus = "{{ booking.status|default:'' }}";
            if (currentStatus) {
                for (var i = 0; i < statusSelect.options.length; i++) {
                    if (statusSelect.options[i].value === currentStatus) {
                        statusSelect.options[i].selected = true;
                        break;
                    }
                }
            }
        }

        var paymentSelect = document.querySelector('select[name="payment_method"]');
        if (paymentSelect) {
            var currentPayment = "{{ booking.payment_method|default:'' }}";
            if (currentPayment) {
                for (var i = 0; i < paymentSelect.options.length; i++) {
                    if (paymentSelect.options[i].value === currentPayment) {
                        paymentSelect.options[i].selected = true;
                        break;
                    }
                }
            }
        }
    });
</script>
{% endblock %}
