<!-- templates/admin/base_admin.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %} - Travel Site</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .wrapper {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            position: sticky;
            top: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #e67e22;
            border-radius: 4px;
        }

        .sidebar-brand {
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .sidebar-brand h5 {
            color: #e67e22;
            font-weight: 600;
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .sidebar-brand small {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 10px 0;
            overflow-y: auto;
        }

        .sidebar-nav .nav-link {
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            margin: 2px 8px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .sidebar-nav .nav-link i {
            width: 22px;
            font-size: 15px;
            margin-right: 12px;
            text-align: center;
        }

        .sidebar-nav .nav-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-nav .nav-link.active {
            color: white;
            background: #e67e22;
        }

        .sidebar-nav .nav-link.text-warning {
            color: #f8b600 !important;
        }

        .sidebar-nav .nav-link.text-warning:hover {
            background: rgba(248, 182, 0, 0.15);
        }

        .sidebar-nav .nav-link.text-danger {
            color: #e74c3c !important;
        }

        .sidebar-nav .nav-link.text-danger:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        .sidebar-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 8px 16px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            height: 100vh;
            background: #f0f2f5;
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: #c0c4cc;
            border-radius: 4px;
        }

        .main-content::-webkit-scrollbar-thumb:hover {
            background: #a0a4ac;
        }

        /* ===== CARDS ===== */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            background: white;
        }

        .card-body {
            padding: 20px;
        }

        /* ===== STATS ===== */
        .stats-card {
            color: white;
            padding: 18px 22px;
            border-radius: 12px;
            margin-bottom: 18px;
            transition: transform 0.2s;
        }

        .stats-card:hover {
            transform: translateY(-3px);
        }

        .stats-card h2 {
            font-size: 2rem;
            font-weight: 700;
            margin: 4px 0;
        }

        .stats-card a {
            color: white;
            text-decoration: underline;
            opacity: 0.8;
            font-size: 13px;
        }

        .stats-card a:hover {
            opacity: 1;
        }

        /* ===== ALERTS ===== */
        .alert {
            border-radius: 10px;
            border: none;
            padding: 12px 18px;
        }

        .alert-dismissible .btn-close {
            padding: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                min-width: 60px;
            }

            .sidebar-brand h5 {
                font-size: 13px;
            }

            .sidebar-brand small {
                display: none;
            }

            .sidebar-nav .nav-link {
                padding: 10px 12px;
                font-size: 12px;
                justify-content: center;
            }

            .sidebar-nav .nav-link span {
                display: none;
            }

            .sidebar-nav .nav-link i {
                margin-right: 0;
                font-size: 18px;
            }

            .main-content {
                padding: 15px;
            }

            .stats-card h2 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 576px) {
            .sidebar {
                width: 50px;
                min-width: 50px;
            }

            .sidebar-nav .nav-link {
                padding: 8px 10px;
            }

            .main-content {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- ===== SIDEBAR ===== -->
        <nav class="sidebar">
            <div class="sidebar-brand">
                <h5>Admin</h5>
            </div>

            <div class="sidebar-nav">
                <a class="nav-link" href="{% url 'pages:admin_dashboard' %}">
                    <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
                </a>
                <a class="nav-link" href="{% url 'pages:manage_banners' %}">
                    <i class="fas fa-image"></i> <span>Banners</span>
                </a>
                <a class="nav-link" href="{% url 'pages:manage_blogs' %}">
                    <i class="fas fa-blog"></i> <span>Blogs</span>
                </a>
                <a class="nav-link" href="{% url 'pages:manage_bookings' %}">
                    <i class="fas fa-ticket-alt"></i> <span>Bookings</span>
                </a>
                <a class="nav-link" href="{% url 'pages:admin_users' %}">
                    <i class="fas fa-users"></i> <span>Users</span>
                </a>
                <a class="nav-link" href="{% url 'flights:admin_flights' %}">
                    <i class="fas fa-plane"></i> <span>Flights</span>
                </a>
                <a class="nav-link" href="{% url 'hotels:admin_hotels' %}">
                    <i class="fas fa-hotel"></i> <span>Hotels</span>
                </a>
                <a class="nav-link" href="{% url 'pages:manage_about' %}">
                    <i class="fas fa-info-circle"></i> <span>About</span>
                </a>

                <div class="sidebar-divider"></div>

                <a class="nav-link text-warning" href="{% url 'pages:index' %}">
                    <i class="fas fa-home"></i> <span>View Site</span>
                </a>
                <a class="nav-link text-danger" href="{% url 'pages:logout' %}">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </a>
            </div>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}

        </main>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
