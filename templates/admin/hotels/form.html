<!-- templates\admin\hotels\form.html -->

{% extends 'admin/base_admin.html' %}

{% block title %}{{ action }} Hotel{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ action }} Hotel</h2>
    <a href="{% url 'hotels:admin_hotels' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Hotels
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Hotel Name *</label>
                    <input type="text" name="name" class="form-control" value="{{ hotel.name|default:'' }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">English Name</label>
                    <input type="text" name="english_name" class="form-control"
                        value="{{ hotel.english_name|default:'' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">City *</label>
                    <input type="text" name="city" class="form-control" value="{{ hotel.city|default:'' }}" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" name="country" class="form-control" value="{{ hotel.country|default:'Iran' }}">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Star Rating *</label>
                    <input type="number" name="star_rating" class="form-control" min="1" max="5"
                        value="{{ hotel.star_rating|default:'3' }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Address *</label>
                <textarea name="address" class="form-control" rows="2"
                    required>{{ hotel.address|default:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Description *</label>
                <textarea name="description" class="form-control" rows="4"
                    required>{{ hotel.description|default:'' }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Minimum Price (Toman) *</label>
                    <input type="number" name="min_price" class="form-control" value="{{ hotel.min_price|default:0 }}"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ hotel.phone|default:'' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ hotel.email|default:'' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Website</label>
                    <input type="url" name="website" class="form-control" value="{{ hotel.website|default:'' }}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Check-in Time</label>
                    <input type="time" name="check_in_time" class="form-control"
                        value="{{ hotel.check_in_time|default:'14:00' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Check-out Time</label>
                    <input type="time" name="check_out_time" class="form-control"
                        value="{{ hotel.check_out_time|default:'12:00' }}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Main Image</label>
                {% if hotel and hotel.images.first %}
                <div class="mb-2">
                    <img src="{{ hotel.images.first.image.url }}" alt="" style="max-height: 100px;">
                    <p class="text-muted">Current main image</p>
                </div>
                {% endif %}
                <input type="file" name="main_image" class="form-control" accept="image/*">
            </div>

            <div class="mb-3">
                <label class="form-label">Additional Images</label>
                <input type="file" name="additional_images" class="form-control" multiple accept="image/*">
            </div>

            <div class="mb-3">
                <label class="form-label">Amenities</label>
                <textarea name="amenities_text" class="form-control" rows="3"
                    placeholder="Enter amenities separated by comma (e.g., WiFi, Breakfast, Pool, Parking)">{{ amenities_text }}</textarea>
                <small class="text-muted">Separate amenities with commas</small>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" value="on" {{
                        is_checked }}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">{{ action }} Hotel</button>
            <a href="{% url 'hotels:admin_hotels' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
