{% extends 'admin/base_admin.html' %}

{% block title %}{{ action }} Banner{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>{{ action }} Banner</h4>
    <a href="{% url 'pages:manage_banners' %}" class="btn btn-secondary btn-sm">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label">Title *</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ banner.title }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="subtitle" class="form-label">Subtitle *</label>
                    <input type="text" class="form-control" id="subtitle" name="subtitle" value="{{ banner.subtitle }}"
                        required>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description *</label>
                <textarea class="form-control" id="description" name="description" rows="3"
                    required>{{ banner.description }}</textarea>
            </div>

            <div class="mb-3">
                <label for="background_image" class="form-label">Background Image</label>
                {% if banner.background_image %}
                <div class="mb-2">
                    <img src="{{ banner.background_image.url }}" alt="" style="max-height: 80px; border-radius: 6px;">
                    <small class="text-muted d-block">Current image</small>
                </div>
                {% endif %}
                <input type="file" class="form-control" id="background_image" name="background_image">
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {{ is_checked }}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="fas fa-save"></i> {{ action }} Banner
                </button>
                <a href="{% url 'pages:manage_banners' %}" class="btn btn-secondary btn-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
